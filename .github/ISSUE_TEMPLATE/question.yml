name: Question
description: Ask a usage question
title: "[Question]: "
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: secure-kit version
      placeholder: "0.1.0"
  - type: textarea
    id: context
    attributes:
      label: Configuration and code
      description: Remove secrets and personal data before pasting.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I read the README and FAQ.
          required: true
        - label: I removed secrets and personal data.
          required: true
