name: Bug report
description: Report a reproducible bug in secure-kit-spring-boot
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include real secrets, tokens, or personal data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: secure-kit version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: "17"
    validations:
      required: true
  - type: input
    id: spring-boot
    attributes:
      label: Spring Boot version
      placeholder: "3.2.5"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Code, configuration, or a small repository that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal data before pasting.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and personal data from logs.
          required: true
        - label: This is not a security vulnerability report.
          required: true
