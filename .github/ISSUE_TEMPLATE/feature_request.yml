name: Feature request
description: Suggest a new capability or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - mask
        - audit
        - log-guard
        - core
        - demo
        - documentation
        - other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not ask for authentication, authorization, JWT, OAuth2, or cryptography.
          required: true
        - label: This request keeps the capability default-off and library-oriented.
          required: true
